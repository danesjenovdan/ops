# Copy this file to secret.yaml and fill in the values, then apply.
# secrets.yaml is gitignored.
apiVersion: v1
kind: Secret
metadata:
  name: kimai-env
type: Opaque
stringData:
  # Connection to the MariaDB.
  # The "kimai" database and user must already exist (see README.md).
  # serverVersion should match the running MariaDB (currently 12.0.2).
  DATABASE_URL: "mysql://kimai:<password>@<DBhost>:3306/kimai?charset=utf8mb4&serverVersion=mariadb-12.0.2"
  # openssl rand -hex 32
  APP_SECRET: ""
  # Pipe-separated list of hostnames Kimai will answer to.
  TRUSTED_HOSTS: "kimai.example.com|kimai.otherexample.com"
  # Initial super-admin, created automatically on first boot.
  ADMINMAIL: "admin@example.com"
  ADMINPASS: ""
  # Outgoing mail. "null://null" disables email; use an SMTP DSN in production, e.g.
  #   smtp://user:pass@smtp.example.com:587
  MAILER_URL: "null://null"
  MAILER_FROM: "kimai@djnd.si"
