apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mapproxy
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-production"
    traefik.ingress.kubernetes.io/router.middlewares: |
      traefik-redirect-to-https@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - mapproxy.danesjenovdan.si
      secretName: mapproxy-tls
  rules:
    - host: mapproxy.danesjenovdan.si
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mapproxy
                port:
                  number: 9090
